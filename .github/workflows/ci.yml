# Unit tests plus a real Windows Firewall round trip on every push and PR.
# Hosted windows-latest is approved for this public repo only (owner, 09/11/2026):
# the app is Windows-only and the self-hosted runners are Macs.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Windows Firewall round trip (add, read back, remove)
        run: python tests/windows_integration.py

      - name: App self-test
        run: python main.py --self-test
